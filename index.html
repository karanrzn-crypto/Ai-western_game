<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Western Game — Playable Map</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    body{position:relative}
    #stage{position:fixed;inset:0;background:#6e6758}
    #stage canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;inset:0;pointer-events:none}
    .panel{position:absolute;top:16px;left:16px;min-width:250px;padding:12px 14px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(12,12,14,.72);backdrop-filter:blur(7px);box-shadow:0 8px 28px rgba(0,0,0,.25)}
    .title{margin-bottom:8px;color:#d7bd7c;font-size:11px;font-weight:800;letter-spacing:.14em}
    .row{display:flex;justify-content:space-between;gap:20px;padding:3px 0;font-size:11px}.key{color:#a7a195}.value{color:#f1eadf;font-variant-numeric:tabular-nums}
    #crosshair{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%)}
    #crosshair:before,#crosshair:after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,255,255,.9);transform:translate(-50%,-50%);box-shadow:0 0 4px rgba(0,0,0,.6)}
    #crosshair:before{width:2px;height:16px}#crosshair:after{width:16px;height:2px}
    #control-hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(255,255,255,.15);border-radius:7px;background:rgba(12,12,14,.72);color:#ddd5c8;font-size:11px;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.22)}
    .badge{display:inline-block;margin-top:7px;padding:3px 6px;border-radius:4px;background:rgba(116,153,100,.2);color:#9fca8b;font-size:9px;letter-spacing:.08em}
  </style>
</head>
<body>
  <main id="stage" aria-label="AI-Western Game playable map"></main>
  <div id="hud">
    <div class="panel">
      <div class="title">AI-WESTERN GAME // PLAYABLE MAP</div>
      <div class="row"><span class="key">Managed objects</span><span class="value" id="stat-count">—</span></div>
      <div class="row"><span class="key">Rendered objects</span><span class="value" id="stat-render">—</span></div>
      <div class="row"><span class="key">Player X / Y / Z</span><span class="value" id="player-position">—</span></div>
      <div class="row"><span class="key">Map</span><span class="value">60 × 60</span></div>
      <div class="badge">FOUNDATION + MOVEMENT</div>
    </div>
    <div id="crosshair"></div>
    <div id="control-hint">Click map · WASD move · mouse look · Shift sprint · Esc release</div>
  </div>
  <script type="module" src="./demo/playable-map.ts"></script>
</body>
</html>
